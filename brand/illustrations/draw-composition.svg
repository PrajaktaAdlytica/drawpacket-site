<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">PA-07 amount reconciliation</title><desc id="d">Synthetic example: $84,000 requested. $65,000 current work plus $5,000 stored materials plus $8,000 approved change equals $78,000 supported. The difference is $6,000, requiring review.</desc><style>text{font-family:Arial,sans-serif;fill:#252225;font-variant-numeric:tabular-nums}.bar{transform-box:fill-box;transform-origin:left;animation:grow 1.6s cubic-bezier(.22,1,.36,1) both}.supported{animation-delay:.3s}.gap{animation:show .4s 1.6s both}@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}@keyframes show{from{opacity:0}to{opacity:1}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}</style><rect width="720" height="420" fill="#F5F5F1"/><text x="40" y="34" font-size="11" letter-spacing="1.5">DEMO — SYNTHETIC DATA / PA-07</text><text x="40" y="90" font-size="18">Requested</text><text x="680" y="90" font-size="22" text-anchor="end">$84,000</text><rect class="bar" x="40" y="110" width="640" height="40" rx="2" fill="#642A37"/><text x="40" y="199" font-size="18">Supported by the illustrated sources</text><text x="680" y="199" font-size="22" text-anchor="end">$78,000</text><g class="bar supported"><rect x="40" y="220" width="495.238" height="40" fill="#642A37"/><rect x="535.238" y="220" width="38.095" height="40" fill="#B4A6BF"/><rect x="573.333" y="220" width="60.952" height="40" fill="#DFDBE8"/></g><g class="gap"><rect x="634.285" y="220" width="45.715" height="40" fill="#FFF0C5" stroke="#875B06" stroke-dasharray="3 3"/><path d="M657 267V296H490" fill="none" stroke="#875B06"/><text x="490" y="318" font-size="14" text-anchor="end" style="fill:#875B06">! $6,000 variance — review required</text></g><rect x="40" y="351" width="10" height="10" fill="#642A37"/><text x="58" y="361" font-size="12">Work $65,000</text><rect x="231" y="351" width="10" height="10" fill="#B4A6BF"/><text x="249" y="361" font-size="12">Materials $5,000</text><rect x="448" y="351" width="10" height="10" fill="#DFDBE8" stroke="#B5ADB4"/><text x="466" y="361" font-size="12">Approved CO $8,000</text><text x="40" y="398" font-size="11">Illustrative current gross amounts; excludes prior payments, tax and retainage.</text></svg>
